<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="780" viewBox="0 0 2200 780">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#E5E7EB" flood-opacity="0.8"/>
  </filter>
  <marker id="arrow" markerWidth="14" markerHeight="10" refX="11" refY="5" orient="auto">
    <path d="M0,0 L12,5 L0,10 z" fill="#D1D5DB"/>
  </marker>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #1F2937; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #6B7280; }
    .section { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #6B7280; }
    .boxTitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #1F2937; }
    .boxText { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #6B7280; }
    .metric { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #1F2937; }
    .metricSmall { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #6B7280; }
    .stepNum { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #6B7280; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<line x1="90" y1="34" x2="2110" y2="34" stroke="#1F2937" stroke-width="2"/>
<text x="90" y="68" class="title">Genome-resolved discovery and prioritization of candidate antimicrobial peptides</text>
<text x="90" y="98" class="subtitle">Alligator gut metagenome</text>

