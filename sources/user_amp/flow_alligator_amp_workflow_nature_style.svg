<text x="90" y="480" class="section">KEY RESULTS</text>
<rect x="110" y="520" width="1980" height="170" rx="28" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.4"/>
<line x1="180" y1="598" x2="2020" y2="598" stroke="#D1D5DB" stroke-width="2.5"/><circle cx="180.0" cy="598" r="9" fill="#54A24B" stroke="white" stroke-width="2"/><text x="180.0" y="574" text-anchor="middle" class="metric">3 refined bins</text><circle cx="640.0" cy="598" r="9" fill="#54A24B" stroke="white" stroke-width="2"/><text x="640.0" y="574" text-anchor="middle" class="metric">Target MAG: bin.1</text><circle cx="1100.0" cy="598" r="9" fill="#9C6ADE" stroke="white" stroke-width="2"/><text x="1100.0" y="574" text-anchor="middle" class="metric">131,816 peptides</text><circle cx="1560.0" cy="598" r="9" fill="#F28E2B" stroke="white" stroke-width="2"/><text x="1560.0" y="574" text-anchor="middle" class="metric">13,296 AMP candidates</text><circle cx="2020.0" cy="598" r="9" fill="#E15759" stroke="white" stroke-width="2"/><text x="2020.0" y="574" text-anchor="middle" class="metric">3 final prioritized peptides</text><text x="640.0" y="626" text-anchor="middle" class="metricSmall">97.04% completeness | 0.146% contamination</text><text x="1560.0" y="626" text-anchor="middle" class="metricSmall">935 non-toxic → 268 low-allergen → 49 developable → 15 therapeutic-priority</text>
<text x="110" y="722" class="subtitle">Final output: a short list of candidate antimicrobial peptides for downstream synthesis and experimental validation.</text>
