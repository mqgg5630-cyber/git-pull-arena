    <circle cx="1684.0" cy="286" r="6" fill="#F28E2B" stroke="white" stroke-width="2"/>
    <rect x="1851.0" y="240" width="250" height="92" rx="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.6"/>
