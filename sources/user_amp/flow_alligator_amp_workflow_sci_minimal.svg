    <text x="172" y="575" class="boxText">bin.1 retained</text>
    <circle cx="545" cy="556.0" r="21" fill="#27AE60" />
    <text x="545" y="563.0" text-anchor="middle" class="stepNum">4</text>
    <line x1="310.0" y1="714" x2="310.0" y2="730" stroke="#C8D3E1" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="130" y="626" width="360" height="88" rx="22" fill="#FFFFFF" stroke="#9B51E0" stroke-width="3.5"/>
    <rect x="144" y="640" width="12" height="60" rx="6" fill="#9B51E0"/>
    <text x="172" y="662" class="boxTitle">sORF mining</text>
    <text x="172" y="689" class="boxText">EMBOSS getorf</text>
    <circle cx="545" cy="670.0" r="21" fill="#9B51E0" />
    <text x="545" y="677.0" text-anchor="middle" class="stepNum">5</text>
    <line x1="310.0" y1="828" x2="310.0" y2="844" stroke="#C8D3E1" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="130" y="740" width="360" height="88" rx="22" fill="#FFFFFF" stroke="#F2994A" stroke-width="3.5"/>
    <rect x="144" y="754" width="12" height="60" rx="6" fill="#F2994A"/>
    <text x="172" y="776" class="boxTitle">Deep-learning AMP screen</text>
    <text x="172" y="803" class="boxText">Attention + LSTM + BERT</text>
    <circle cx="545" cy="784.0" r="21" fill="#F2994A" />
    <text x="545" y="791.0" text-anchor="middle" class="stepNum">6</text>
    
    <rect x="130" y="854" width="360" height="88" rx="22" fill="#FFFFFF" stroke="#EB5757" stroke-width="3.5"/>
    <rect x="144" y="868" width="12" height="60" rx="6" fill="#EB5757"/>
    <text x="172" y="890" class="boxTitle">Multi-step prioritization</text>
    <text x="172" y="917" class="boxText">ToxinPred2 → AlgPred2 → PepFun → TheraPepNet → AxPep</text>
    <circle cx="545" cy="898.0" r="21" fill="#EB5757" />
    <text x="545" y="905.0" text-anchor="middle" class="stepNum">7</text>
    
<path d="M 590 808 C 740 808, 860 808, 1110 808" fill="none" stroke="#C8D3E1" stroke-width="6" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<text x="1176" y="240" class="resTitle">Progressive reduction of candidates</text>
<text x="1176" y="270" class="subtitle">Only the main quantitative milestones are shown.</text>
<rect x="1176" y="305" width="508" height="52" rx="18" fill="#27AE6018" stroke="#27AE60" stroke-width="2.2"/><circle cx="1200" cy="331.0" r="8" fill="#27AE60"/><text x="1218" y="339" class="resText">3 refined bins</text><rect x="1176" y="373" width="508" height="52" rx="18" fill="#27AE6018" stroke="#27AE60" stroke-width="2.2"/><circle cx="1200" cy="399.0" r="8" fill="#27AE60"/><text x="1218" y="407" class="resText">Target MAG: bin.1</text><rect x="1176" y="441" width="508" height="52" rx="18" fill="#27AE6018" stroke="#27AE60" stroke-width="2.2"/><circle cx="1200" cy="467.0" r="8" fill="#27AE60"/><text x="1218" y="465" class="resText">97.04% completeness</text><text x="1218" y="483" class="resSmall">0.146% contamination</text><rect x="1176" y="509" width="508" height="52" rx="18" fill="#9B51E018" stroke="#9B51E0" stroke-width="2.2"/><circle cx="1200" cy="535.0" r="8" fill="#9B51E0"/><text x="1218" y="543" class="resText">131,816 candidate peptides</text><rect x="1176" y="577" width="508" height="52" rx="18" fill="#F2994A18" stroke="#F2994A" stroke-width="2.2"/><circle cx="1200" cy="603.0" r="8" fill="#F2994A"/><text x="1218" y="611" class="resText">13,296 high-confidence AMP candidates</text><rect x="1176" y="645" width="508" height="52" rx="18" fill="#14B8A618" stroke="#14B8A6" stroke-width="2.2"/><circle cx="1200" cy="671.0" r="8" fill="#14B8A6"/><text x="1218" y="679" class="resText">935 non-toxic peptides</text><rect x="1176" y="713" width="508" height="52" rx="18" fill="#14B8A618" stroke="#14B8A6" stroke-width="2.2"/><circle cx="1200" cy="739.0" r="8" fill="#14B8A6"/><text x="1218" y="747" class="resText">268 low-allergen peptides</text><rect x="1176" y="781" width="508" height="52" rx="18" fill="#14B8A618" stroke="#14B8A6" stroke-width="2.2"/><circle cx="1200" cy="807.0" r="8" fill="#14B8A6"/><text x="1218" y="815" class="resText">49 developable peptides</text><rect x="1176" y="849" width="508" height="52" rx="18" fill="#14B8A618" stroke="#14B8A6" stroke-width="2.2"/><circle cx="1200" cy="875.0" r="8" fill="#14B8A6"/><text x="1218" y="883" class="resText">15 therapeutic-priority peptides</text><rect x="1176" y="917" width="508" height="52" rx="18" fill="#EB575718" stroke="#EB5757" stroke-width="2.2"/><circle cx="1200" cy="943.0" r="8" fill="#EB5757"/><text x="1218" y="951" class="resText">3 final prioritized candidates</text>
<rect x="90" y="975" width="1630" height="82" rx="24" fill="#FFFFFF" stroke="#C8D3E1" stroke-width="2"/>
<text x="120" y="1010" class="boxTitle">Final output</text>
<text x="120" y="1038" class="boxText">A short list of 3 prioritized candidate antimicrobial peptides for downstream synthesis and experimental validation.</text>
