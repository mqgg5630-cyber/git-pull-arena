<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#DCE6F4" flood-opacity="0.8"/>
  </filter>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FBFF"/>
    <stop offset="100%" stop-color="#F3F7FB"/>
  </linearGradient>
  <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2F80ED"/>
    <stop offset="50%" stop-color="#9B51E0"/>
    <stop offset="100%" stop-color="#EB5757"/>
  </linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#C8D3E1"/>
  </marker>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; fill: #183153; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #5B6B82; }
    .boxTitle { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; fill: #183153; }
    .boxText { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #5B6B82; }
    .resTitle { font-family: Arial, Helvetica, sans-serif; font-size: 27px; font-weight: 700; fill: #183153; }
    .resText { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #183153; }
    .resSmall { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #5B6B82; }
    .panelLabel { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; fill: #5B6B82; }
    .stepNum { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: white; }
  </style>
</defs>
<rect width="100%" height="100%" fill="url(#bgGrad)"/>
<rect x="80" y="26" width="1640" height="6" rx="3" fill="url(#headerGrad)"/>
<text x="90" y="58" class="title">Genome-resolved discovery and prioritization of candidate antimicrobial peptides</text>
<text x="90" y="86" class="subtitle">Alligator gut metagenome | streamlined workflow and key results</text>

<rect x="90" y="152" width="980" height="796" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<rect x="1140" y="152" width="580" height="796" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
<text x="124" y="188" class="panelLabel">WORKFLOW</text>
<text x="1174" y="188" class="panelLabel">KEY RESULTS</text>
<line x1="310.0" y1="258" x2="310.0" y2="274" stroke="#C8D3E1" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="130" y="170" width="360" height="88" rx="22" fill="#FFFFFF" stroke="#2F80ED" stroke-width="3.5"/>
    <rect x="144" y="184" width="12" height="60" rx="6" fill="#2F80ED"/>
    <text x="172" y="206" class="boxTitle">Raw metagenome</text>
