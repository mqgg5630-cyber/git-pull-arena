    <circle cx="545" cy="442.0" r="21" fill="#27AE60" />
    <text x="545" y="449.0" text-anchor="middle" class="stepNum">3</text>
    <line x1="310.0" y1="600" x2="310.0" y2="616" stroke="#C8D3E1" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="130" y="512" width="360" height="88" rx="22" fill="#FFFFFF" stroke="#27AE60" stroke-width="3.5"/>
    <rect x="144" y="526" width="12" height="60" rx="6" fill="#27AE60"/>
