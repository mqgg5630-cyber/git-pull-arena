<svg viewBox="0 0 1240 418" width="2244" height="757" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ga-title ga-desc">
<title id="ga-title">Machine-learning-guided discovery of umami peptides</title>
<desc id="ga-desc">Workflow from protein libraries and curated taste data through feature encoding and ML/DL prediction models to consensus docking, sensory validation and low-sodium food application.</desc>

