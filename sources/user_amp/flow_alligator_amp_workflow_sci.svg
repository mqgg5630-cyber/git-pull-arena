<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2735" viewBox="0 0 1800 2735">
<rect width="100%" height="100%" fill="white"/>
<style>
.title{font-family:Arial,Helvetica,sans-serif;font-size:48px;font-weight:700;}
.hdr{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;}
.txt{font-family:Arial,Helvetica,sans-serif;font-size:26px;}
.small{font-family:Arial,Helvetica,sans-serif;font-size:24px;}
</style>
<text x="900.0" y="110" text-anchor="middle" class="title">Workflow for genome-resolved identification and prioritization of candidate antimicrobial peptides from the alligator gut metagenome</text>
<rect x="170" y="180" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="232" x2="1630" y2="232" stroke="black" stroke-width="3"/>
<text x="198" y="218" class="hdr">Raw metagenomic input</text>
<text x="204" y="278" class="txt">• Paired-end shotgun metagenomic reads</text>
<text x="204" y="312" class="txt">• SRR18112698_1.fastq.gz and SRR18112698_2.fastq.gz</text>
<line x1="900" y1="389" x2="900" y2="431" stroke="black" stroke-width="4"/>
<polygon points="900,449 882,431 918,431" fill="black"/>
<rect x="170" y="455" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="507" x2="1630" y2="507" stroke="black" stroke-width="3"/>
<text x="198" y="493" class="hdr">Quality control and host decontamination</text>
<text x="204" y="553" class="txt">• fastp for read quality control</text>
<text x="204" y="587" class="txt">• KneadData with host reference database</text>
<text x="204" y="621" class="txt">• Bowtie2: --very-sensitive --dovetail --reorder</text>
<line x1="900" y1="664" x2="900" y2="706" stroke="black" stroke-width="4"/>
<polygon points="900,724 882,706 918,706" fill="black"/>
<rect x="170" y="730" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="782" x2="1630" y2="782" stroke="black" stroke-width="3"/>
<text x="198" y="768" class="hdr">Assembly and genome binning</text>
<text x="204" y="828" class="txt">• MEGAHIT de novo assembly</text>
<text x="204" y="862" class="txt">• metaWRAP binning with MetaBAT2 and MaxBin2</text>
<text x="204" y="896" class="txt">• bin_refinement retained bins with completeness ≥50% and contamination ≤10%</text>
<line x1="900" y1="939" x2="900" y2="981" stroke="black" stroke-width="4"/>
<polygon points="900,999 882,981 918,981" fill="black"/>
<rect x="170" y="1005" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="1057" x2="1630" y2="1057" stroke="black" stroke-width="3"/>
<text x="198" y="1043" class="hdr">Target MAG selection</text>
<text x="204" y="1103" class="txt">• CheckM lineage_wf for genome quality assessment</text>
<text x="204" y="1137" class="txt">• GTDB-Tk for taxonomic annotation</text>
<text x="204" y="1171" class="txt">• High-quality target MAG: bin.1</text>
<text x="204" y="1205" class="txt">• Completeness 97.04%; contamination 0.146%</text>
<line x1="900" y1="1214" x2="900" y2="1256" stroke="black" stroke-width="4"/>
<polygon points="900,1274 882,1256 918,1256" fill="black"/>
<rect x="170" y="1280" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="1332" x2="1630" y2="1332" stroke="black" stroke-width="3"/>
<text x="198" y="1318" class="hdr">sORF mining from the target MAG</text>
<text x="204" y="1378" class="txt">• EMBOSS getorf with bacterial translation table 11</text>
<text x="204" y="1412" class="txt">• Length range: 15–150 nt</text>
<text x="204" y="1446" class="txt">• Merged ORFs and removed duplicate peptide sequences</text>
<text x="204" y="1480" class="txt">• 131,816 candidate short peptides</text>
<line x1="900" y1="1489" x2="900" y2="1531" stroke="black" stroke-width="4"/>
<polygon points="900,1549 882,1531 918,1531" fill="black"/>
<rect x="170" y="1555" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="1607" x2="1630" y2="1607" stroke="black" stroke-width="3"/>
<text x="198" y="1593" class="hdr">Deep-learning AMP prescreening</text>
<text x="204" y="1653" class="txt">• c_AMPs-prediction framework</text>
<text x="204" y="1687" class="txt">• Attention + LSTM + BERT</text>
<text x="204" y="1721" class="txt">• High-confidence AMP candidates defined by 3/3 positive calls</text>
<text x="204" y="1755" class="txt">• 13,296 high-confidence candidates</text>
<line x1="900" y1="1764" x2="900" y2="1806" stroke="black" stroke-width="4"/>
<polygon points="900,1824 882,1806 918,1806" fill="black"/>
<rect x="170" y="1830" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="1882" x2="1630" y2="1882" stroke="black" stroke-width="3"/>
<text x="198" y="1868" class="hdr">Local prescreening</text>
<text x="204" y="1928" class="txt">• Basic sequence legality filtering</text>
<text x="204" y="1962" class="txt">• MMseqs2 dereplication: 13,294 representative peptides</text>
<text x="204" y="1996" class="txt">• ToxinPred2 toxicity filtering (model 1, threshold 0.60)</text>
<text x="204" y="2030" class="txt">• 935 non-toxic peptides</text>
<line x1="900" y1="2039" x2="900" y2="2081" stroke="black" stroke-width="4"/>
<polygon points="900,2099 882,2081 918,2081" fill="black"/>
<rect x="170" y="2105" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="2157" x2="1630" y2="2157" stroke="black" stroke-width="3"/>
<text x="198" y="2143" class="hdr">Web-based multistage prioritization</text>
<text x="204" y="2203" class="txt">• AlgPred2 non-allergen filtering: 268 peptides</text>
<text x="204" y="2237" class="txt">• PepFun developability filtering: 49 peptides</text>
<text x="204" y="2271" class="txt">• TheraPepNet therapeutic-peptide prioritization: 15 peptides</text>
<text x="204" y="2305" class="txt">• AxPep final AMP consensus screening: 3 peptides</text>
<line x1="900" y1="2314" x2="900" y2="2356" stroke="black" stroke-width="4"/>
<polygon points="900,2374 882,2356 918,2356" fill="black"/>
<rect x="170" y="2380" width="1460" height="205" rx="26" ry="26" fill="white" stroke="black" stroke-width="4"/>
<line x1="170" y1="2432" x2="1630" y2="2432" stroke="black" stroke-width="3"/>
<text x="198" y="2418" class="hdr">Final novelty and physicochemical characterization</text>
<text x="204" y="2478" class="txt">• UniProt peptide search: no direct peptide hit for all 3 finalists</text>
<text x="204" y="2512" class="txt">• ExPASy ProtParam for molecular weight, pI, instability index,</text>
<text x="204" y="2546" class="txt">• aliphatic index, hydrophobicity, and amino-acid composition</text>
<text x="900.0" y="2695" text-anchor="middle" class="small">Final output: a prioritized shortlist of candidate antimicrobial peptides for downstream synthesis and experimental validation</text>
</svg>