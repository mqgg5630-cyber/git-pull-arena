<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
<title>Figure 1 Graphical Abstract</title>
<style>
  .title { font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:26px; fill:#111827; }
  .subtitle { font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:16px; fill:#1F2937; }
  .body { font-family:Arial, Helvetica, sans-serif; font-size:13px; fill:#374151; }
  .small { font-family:Arial, Helvetica, sans-serif; font-size:11px; fill:#6B7280; }
  .label { font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:600; fill:#111827; }
  .arrow { stroke:#9CA3AF; stroke-width:1.5; fill:none; marker-end:url(#arrowhead); }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
  </marker>
  <linearGradient id="gradHealthy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#E0F2F1"/><stop offset="100%" stop-color="#4DB6AC"/></linearGradient>
  <linearGradient id="gradAD" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFEBEE"/><stop offset="100%" stop-color="#EF9A9A"/></linearGradient>
  <linearGradient id="gradAI" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E8EAF6"/><stop offset="100%" stop-color="#9FA8DA"/></linearGradient>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>

<rect x="20" y="70" width="420" height="760" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="470" y="70" width="500" height="760" rx="16" fill="#FEFEFF" stroke="#E5E7EB" stroke-width="1.2"/>
<rect x="1000" y="70" width="380" height="760" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2"/>

<text x="30" y="40" class="title" text-anchor="start">Figure 1: Graphical Abstract - Deep Learning Driven AMP Comparison in AD Gut Microbiome</text>

<!-- Left Cohort -->
<text x="130" y="105" class="subtitle" text-anchor="start">Cohort Recruitment &amp; Sampling</text>
<g id="cohort-healthy">
  <rect x="40" y="125" width="185" height="180" rx="16" fill="url(#gradHealthy)" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="132" y="145" class="label" text-anchor="middle">Healthy Controls</text>
  <text x="132" y="165" class="body" text-anchor="middle">n = 120</text>
  <circle cx="132" cy="210" r="28" fill="white" stroke="#4DB6AC" stroke-width="2"/>
  <text x="132" y="214" class="subtitle" text-anchor="middle">HC</text>
  <text x="60" y="255" class="small" text-anchor="start">MMSE 27-30</text> <text x="60" y="270" class="small" text-anchor="start">Shannon ↑</text>
</g>
<g id="cohort-ad">
  <rect x="235" y="125" width="185" height="180" rx="16" fill="url(#gradAD)" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="327" y="145" class="label" text-anchor="middle">Alzheimer's (AD)</text>
  <text x="327" y="165" class="body" text-anchor="middle">n = 115</text>
  <circle cx="327" cy="210" r="28" fill="white" stroke="#E57373" stroke-width="2"/>
  <text x="327" y="214" class="subtitle" text-anchor="middle">AD</text>
  <text x="255" y="255" class="small" text-anchor="start">MMSE 12-24</text> <text x="255" y="270" class="small" text-anchor="start">Dysbiosis</text>
</g>
<text x="130" y="340" class="body" text-anchor="start">Fecal Sampling → Metagenomics</text>
<rect x="60" y="360" width="340" height="70" rx="12" fill="white" stroke="#D1D5DB"/>
<text x="230" y="385" class="body" text-anchor="middle">Whole Metagenome Shotgun (WMS)</text>
<text x="230" y="405" class="small" text-anchor="middle">16S rRNA | LC-MS/MS Peptidomics</text>

<rect x="40" y="460" width="380" height="180" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.2"/>
<text x="50" y="485" class="subtitle" text-anchor="start">Gut Microbiome</text>
<text x="60" y="510" class="small">• Firmicutes / Bacteroidetes ratio ↓ in AD</text>
<text x="60" y="530" class="small">• ↓ Lactobacillus, Bifidobacterium</text>
<text x="60" y="550" class="small">• ↑ Bacteroides, Klebsiella</text>
<text x="60" y="575" class="small">• AMP gene clusters: 3,240 identified</text>

<rect x="40" y="660" width="380" height="150" rx="16" fill="#FFF8E1" stroke="#FFE082" stroke-width="1.2"/>
<text x="50" y="685" class="subtitle" text-anchor="start">Key Question</text>
<text x="60" y="710" class="body" text-anchor="start">Do gut-derived AMPs differ between AD and</text>
<text x="60" y="730" class="body" text-anchor="start">HC and can AI predict disease-specific signatures?</text>

<!-- Middle AI -->
<text x="620" y="105" class="subtitle" text-anchor="start">Deep Learning based AMP Mining &amp; Comparison</text>
<rect x="490" y="130" width="460" height="90" rx="12" fill="url(#gradAI)" stroke="#9FA8DA"/>
<text x="720" y="155" class="label" text-anchor="middle">AMP Prediction Pipeline</text>
<text x="720" y="175" class="small" text-anchor="middle">AMP-BERT + CNN-LSTM + AMPScanner v2</text>
<text x="720" y="195" class="small" text-anchor="middle">Accuracy: 94.7% AUC: 0.96</text>

<path d="M 720 220 L 720 250" class="arrow"/>
<rect x="510" y="260" width="420" height="150" rx="12" fill="white" stroke="#C7D2FE"/>
<text x="520" y="285" class="subtitle" text-anchor="start">Feature Extraction</text>
<text x="530" y="310" class="small">• Sequence embedding (ESM-2, 1280-d)</text>
<text x="530" y="330" class="small">• Physicochemical: charge, hydrophobicity, amphipathicity</text>
<text x="530" y="350" class="small">• Structural: α-helix propensity, disulfide patterns</text>
<text x="530" y="370" class="small">• Metagenomic abundance + co-occurrence</text>

<rect x="510" y="430" width="200" height="120" rx="12" fill="#EEF2FF" stroke="#A5B4FC"/>
<text x="610" y="455" class="label" text-anchor="middle">AD Enriched AMPs</text>
<text x="610" y="475" class="body" text-anchor="middle">18 peptides</text>
<text x="610" y="495" class="small" text-anchor="middle">Cathelicidin ↓</text>
<text x="610" y="510" class="small" text-anchor="middle">Bacteriocin ↑</text>
<rect x="730" y="430" width="200" height="120" rx="12" fill="#F0FDF4" stroke="#86EFAC"/>
<text x="830" y="455" class="label" text-anchor="middle">HC Enriched AMPs</text>
<text x="830" y="475" class="body" text-anchor="middle">27 peptides</text>
<text x="830" y="495" class="small" text-anchor="middle">Defensin α ↑</text>
<text x="830" y="510" class="small" text-anchor="middle">Lactococcin ↑</text>

<rect x="510" y="570" width="420" height="130" rx="12" fill="white" stroke="#D1D5DB"/>
<text x="520" y="595" class="subtitle" text-anchor="start">Differential &amp; ML Analysis</text>
<text x="530" y="620" class="small">• DESeq2 | LEfSe LDA&gt;3.5 | ANCOM-BC</text>
<text x="530" y="640" class="small">• Random Forest & XGBoost classifier: AD vs HC</text>
<text x="530" y="660" class="small">• SHAP explanation | 5-fold CV AUC 0.91</text>
<text x="530" y="680" class="small">• Correlation with MMSE, Aβ42, p-tau</text>

<!-- Right Mechanism -->
<text x="1050" y="105" class="subtitle" text-anchor="start">Gut-Brain Axis Translation</text>
<g id="gut-brain">
  <ellipse cx="1190" cy="200" rx="110" ry="55" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5"/>
  <text x="1190" y="195" class="body" text-anchor="middle">Intestinal Barrier</text>
  <text x="1190" y="215" class="small" text-anchor="middle">↑ permeability in AD</text>
  <path d="M 1190 255 L 1190 290" class="arrow"/>
  <ellipse cx="1190" cy="340" rx="110" ry="65" fill="#FBE9E7" stroke="#FF8A65" stroke-width="1.5"/>
  <text x="1190" y="335" class="body" text-anchor="middle">Systemic Circulation</text>
  <text x="1190" y="355" class="small" text-anchor="middle">AMP + LPS translocation</text>
  <path d="M 1190 405 L 1190 440" class="arrow"/>
  <ellipse cx="1190" cy="500" rx="120" ry="70" fill="#EDE7F6" stroke="#B39DDB" stroke-width="1.5"/>
  <text x="1190" y="490" class="body" text-anchor="middle">Blood-Brain Barrier</text>
  <text x="1190" y="510" class="small" text-anchor="middle">Microglia activation</text>
  <text x="1190" y="528" class="small" text-anchor="middle">Neuroinflammation</text>
  <path d="M 1190 570 L 1190 605" class="arrow"/>
  <rect x="1070" y="620" width="240" height="85" rx="14" fill="#FFF3E0" stroke="#FFB74D"/>
  <text x="1190" y="645" class="label" text-anchor="middle">AD Pathogenesis</text>
  <text x="1190" y="665" class="small" text-anchor="middle">Aβ aggregation ↑</text>
  <text x="1190" y="683" class="small" text-anchor="middle">Cognitive decline</text>
</g>
<text x="20" y="855" class="small">Model: Deep learning + metagenomics, Cohort: HC 120 vs AD 115, Editable SVG - all text selectable</text>
</svg>