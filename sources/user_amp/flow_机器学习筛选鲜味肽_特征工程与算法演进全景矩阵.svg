<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" style="background:#F8FAFC; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="gradNavy2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gradBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="gradTeal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0284C7" />
    </marker>
  </defs>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="8" height="42" rx="4" fill="#0D9488"/>
    <text x="24" y="32" font-size="28" font-weight="800" fill="#0F172A">鲜味肽特征工程与算法演进全景矩阵</text>
    <text x="750" y="30" font-size="16" font-weight="600" fill="#64748B">Feature Engineering &amp; Algorithm Evolution Matrix</text>
  </g>

  <!-- Left: 4 Feature Pillars -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="540" height="580" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="540" height="46" rx="16" fill="#F0FDFA"/>
    <rect x="0" y="30" width="540" height="16" fill="#F0FDFA"/>
    <circle cx="25" cy="23" r="6" fill="#0D9488"/>
    <text x="42" y="29" font-size="18" font-weight="700" fill="#0F766E">多维特征编码体系 (Feature Engineering)</text>

    <!-- 4 Sub-cards -->
    <!-- Pillar 1 -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="240" height="235" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="12" y="12" width="216" height="32" rx="6" fill="#E0F2FE"/>
      <text x="120" y="33" font-size="14" font-weight="700" fill="#0369A1" text-anchor="middle">一维序列组成编码</text>
      
      <rect x="12" y="56" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="78" font-size="14" font-weight="700" fill="#0F172A">AAC (20维)</text>
      <text x="24" y="96" font-size="12" font-weight="500" fill="#64748B">氨基酸出现频率统计</text>

      <rect x="12" y="112" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="134" font-size="14" font-weight="700" fill="#0F172A">DPC (400维)</text>
      <text x="24" y="152" font-size="12" font-weight="500" fill="#64748B">相邻二肽对组成频率</text>

      <rect x="12" y="168" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="190" font-size="14" font-weight="700" fill="#0F172A">TPC / k-mer</text>
      <text x="24" y="208" font-size="12" font-weight="500" fill="#64748B">短肽多尺度片段频数</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(280, 60)">
      <rect x="0" y="0" width="240" height="235" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="12" y="12" width="216" height="32" rx="6" fill="#FEF3C7"/>
      <text x="120" y="33" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle">理化与空间自相关</text>
      
      <rect x="12" y="56" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="78" font-size="14" font-weight="700" fill="#0F172A">CTD 描述符</text>
      <text x="24" y="96" font-size="12" font-weight="500" fill="#64748B">组成、转化与分布</text>

      <rect x="12" y="112" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="134" font-size="14" font-weight="700" fill="#0F172A">PAAC / APAAC</text>
      <text x="24" y="152" font-size="12" font-weight="500" fill="#64748B">伪氨基酸空间关联</text>

      <rect x="12" y="168" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="190" font-size="14" font-weight="700" fill="#0F172A">QSO / SOCN</text>
      <text x="24" y="208" font-size="12" font-weight="500" fill="#64748B">准序列阶数耦合</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(20, 315)">
      <rect x="0" y="0" width="240" height="235" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="12" y="12" width="216" height="32" rx="6" fill="#F3E8FF"/>
      <text x="120" y="33" font-size="14" font-weight="700" fill="#7E22CE" text-anchor="middle">分子结构与拓扑</text>
      
      <rect x="12" y="56" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="78" font-size="14" font-weight="700" fill="#0F172A">Mordred 描述符</text>
      <text x="24" y="96" font-size="12" font-weight="500" fill="#64748B">1800+ 2D/3D 参数</text>

      <rect x="12" y="112" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="134" font-size="14" font-weight="700" fill="#0F172A">RDKit 物理化学</text>
      <text x="24" y="152" font-size="12" font-weight="500" fill="#64748B">LogP、TPSA、电荷</text>

      <rect x="12" y="168" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="190" font-size="14" font-weight="700" fill="#0F172A">Morgan 分子指纹</text>
      <text x="24" y="208" font-size="12" font-weight="500" fill="#64748B">ECFP 亚结构拓扑</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(280, 315)">
      <rect x="0" y="0" width="240" height="235" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="12" y="12" width="216" height="32" rx="6" fill="#CCFBF1"/>
      <text x="120" y="33" font-size="14" font-weight="700" fill="#0F766E" text-anchor="middle">深度预训练语言模型</text>
      
      <rect x="12" y="56" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="78" font-size="14" font-weight="700" fill="#0F172A">ESM-2 Embedding</text>
      <text x="24" y="96" font-size="12" font-weight="500" fill="#64748B">1280 维端到端密集向量</text>

      <rect x="12" y="112" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="134" font-size="14" font-weight="700" fill="#0F172A">ProtBERT</text>
      <text x="24" y="152" font-size="12" font-weight="500" fill="#64748B">双向注意力掩码预训练</text>

      <rect x="12" y="168" width="216" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="190" font-size="14" font-weight="700" fill="#0F172A">Umami-BERT</text>
      <text x="24" y="208" font-size="12" font-weight="500" fill="#64748B">自注意力呈味权重热图</text>
    </g>
  </g>

  <!-- Middle Connector Hub -->
  <g transform="translate(630, 310)">
    <rect x="0" y="0" width="140" height="180" rx="14" fill="url(#gradNavy2)" filter="url(#shadow2)"/>
    <text x="70" y="45" font-size="16" font-weight="800" fill="#38BDF8" text-anchor="middle">特征融合</text>
    <text x="70" y="70" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">&amp; 表示学习</text>
    
    <line x1="20" y1="95" x2="120" y2="95" stroke="#334155" stroke-width="1.5"/>
    <text x="70" y="120" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">FRL 降维框架</text>
    <text x="70" y="142" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">AutoEncoder</text>
    <text x="70" y="164" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">多模态融合</text>
  </g>

  <line x1="600" y1="400" x2="625" y2="400" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="775" y1="400" x2="800" y2="400" stroke="#0284C7" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- Right: Algorithm Evolution -->
  <g transform="translate(800, 110)">
    <rect x="0" y="0" width="540" height="580" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="540" height="46" rx="16" fill="#EFF6FF"/>
    <rect x="0" y="30" width="540" height="16" fill="#EFF6FF"/>
    <circle cx="25" cy="23" r="6" fill="#0284C7"/>
    <text x="42" y="29" font-size="18" font-weight="700" fill="#0369A1">算法架构演进谱系 (Model Evolution)</text>

    <!-- Gen 1 -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="500" height="145" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="14" y="12" width="140" height="26" rx="6" fill="#E2E8F0"/>
      <text x="84" y="29" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">第一代 · 经典机器学习</text>
      <text x="470" y="30" font-size="13" font-weight="700" fill="#64748B" text-anchor="end">ACC ~82% - 88%</text>

      <!-- Badges -->
      <rect x="14" y="48" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="89" y="73" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">SVM / 支持向量机</text>

      <rect x="175" y="48" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="250" y="73" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">Random Forest</text>

      <rect x="336" y="48" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="411" y="73" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">GBDT / XGBoost</text>

      <rect x="14" y="96" width="472" height="36" rx="6" fill="#FEF3C7"/>
      <text x="250" y="119" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">代表：iUmami-SCM (评分卡, 0.824)、UMPred-FRL (集成, 0.888)</text>
    </g>

    <!-- Gen 2 -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="500" height="145" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <rect x="14" y="12" width="140" height="26" rx="6" fill="#E0F2FE"/>
      <text x="84" y="29" font-size="12" font-weight="700" fill="#0369A1" text-anchor="middle">第二代 · 深度神经网络</text>
      <text x="470" y="30" font-size="13" font-weight="700" fill="#0284C7" text-anchor="end">ACC ~90.5%</text>

      <rect x="14" y="48" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="89" y="73" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">多尺度 CNN 卷积</text>

      <rect x="175" y="48" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="250" y="73" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">BiLSTM 双向时序</text>

      <rect x="336" y="48" width="150" height="40" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="411" y="73" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">ResNet 残差连接</text>

      <rect x="14" y="96" width="472" height="36" rx="6" fill="#E0F2FE"/>
      <text x="250" y="119" font-size="12" font-weight="600" fill="#0369A1" text-anchor="middle">代表：Umami-MRNN (多残差双向 LSTM, ACC 0.905)</text>
    </g>

    <!-- Gen 3 -->
    <g transform="translate(20, 395)">
      <rect x="0" y="0" width="500" height="165" rx="12" fill="url(#gradNavy2)" stroke="#0284C7" stroke-width="2"/>
      <rect x="14" y="12" width="160" height="26" rx="6" fill="#0284C7"/>
      <text x="94" y="29" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">第三代 · Transformer &amp; 对比</text>
      <text x="470" y="30" font-size="14" font-weight="800" fill="#38BDF8" text-anchor="end">ACC 93.2% - 94.0%</text>

      <rect x="14" y="48" width="225" height="45" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="126" y="75" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Umami-BERT (自注意力)</text>

      <rect x="250" y="48" width="235" height="45" rx="8" fill="#1E293B" stroke="#334155"/>
      <text x="367" y="75" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Contrastive 对比学习 (2025)</text>

      <rect x="14" y="105" width="472" height="45" rx="6" fill="url(#gradTeal2)"/>
      <text x="250" y="132" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">高精度 + 强可解释性 + 支持从头模块替换设计</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="60" y="760" font-size="13" font-weight="500" fill="#94A3B8">技术演进规律：从手工规则与浅层分类器，迈向端到端大语言模型嵌入与自注意力可解释表征学习</text>
</svg>