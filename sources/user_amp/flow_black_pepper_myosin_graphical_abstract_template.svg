<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1400" height="780" viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 700; fill: #111; }
      .title-italic { font-style: italic; }
      .section-header { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 500; fill: #111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #333; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; fill: #222; }
      .keyword { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #111; }
      .panel { fill: #f5f5f5; stroke: #444; stroke-width: 2; }
      .headerbar { fill: #dbe4ec; stroke: none; }
      .imgph { fill: #ffffff; stroke: #9aa7b3; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .imgph2 { fill: #ffffff; stroke: #9aa7b3; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .arrow { stroke: #444; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .thin-arrow { stroke: #666; stroke-width: 1.4; fill: none; marker-end: url(#arrowheadSmall); }
      .divider { stroke: #c7cdd3; stroke-width: 1.2; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <polygon points="0,0 12,5 0,10" fill="#444"/>
    </marker>
    <marker id="arrowheadSmall" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 9,4 0,8" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="#ffffff"/>

  <text x="24" y="38" class="title">
    <tspan class="title-italic">In Silico</tspan>
    <tspan> WORKFLOW: BLACK PEPPER FLAVOR COMPOUNDS BINDING TO BOVINE MYOSIN</tspan>
  </text>

  <g id="panel_compounds">
    <rect x="18" y="58" rx="14" ry="14" width="625" height="335" class="panel"/>
    <rect x="18" y="58" rx="14" ry="14" width="625" height="48" class="headerbar"/>
    <text x="330.5" y="89" text-anchor="middle" class="section-header">Six key flavor compounds</text>

    <g id="compound_piperine">
      <rect x="55" y="112" width="145" height="74" class="imgph"/>
      <text x="127.5" y="154" text-anchor="middle" class="small">Replace compound image</text>
      <text x="127.5" y="222" text-anchor="middle" class="label">piperine</text>
    </g>

    <g id="compound_chavicine">
      <rect x="240" y="105" rx="10" ry="10" width="190" height="102" fill="none" stroke="#444" stroke-width="1.8"/>
      <polygon points="396,113 403,126 417,128 407,138 410,152 396,145 382,152 385,138 375,128 389,126" fill="#f6c54b" stroke="#b38918" stroke-width="1"/>
      <rect x="260" y="120" width="150" height="58" class="imgph"/>
      <text x="335" y="152" text-anchor="middle" class="small">Replace compound image</text>
      <text x="335" y="224" text-anchor="middle" class="label">chavicine</text>
    </g>

    <g id="compound_piperettine">
      <rect x="466" y="112" width="135" height="74" class="imgph"/>
      <text x="533.5" y="154" text-anchor="middle" class="small">Replace compound image</text>
      <text x="533.5" y="222" text-anchor="middle" class="label">piperettine</text>
    </g>

    <g id="compound_beta_caryophyllene">
      <rect x="55" y="235" width="145" height="74" class="imgph"/>
      <text x="127.5" y="277" text-anchor="middle" class="small">Replace compound image</text>
      <text x="127.5" y="345" text-anchor="middle" class="label">β-caryophyllene</text>
    </g>

    <g id="compound_alpha_pinene">
      <rect x="260" y="235" width="150" height="74" class="imgph"/>
      <text x="335" y="277" text-anchor="middle" class="small">Replace compound image</text>
      <text x="335" y="345" text-anchor="middle" class="label">α-pinene</text>
    </g>

    <g id="compound_nerolidol">
      <rect x="466" y="235" width="135" height="74" class="imgph"/>
      <text x="533.5" y="277" text-anchor="middle" class="small">Replace compound image</text>
      <text x="533.5" y="345" text-anchor="middle" class="label">nerolidol</text>
    </g>
  </g>

  <g id="panel_myosin">
    <rect x="980" y="58" rx="14" ry="14" width="395" height="185" class="panel"/>
    <rect x="980" y="58" rx="14" ry="14" width="395" height="48" class="headerbar"/>
    <text x="1177.5" y="89" text-anchor="middle" class="section-header">Bovine myosin</text>
    <rect x="1040" y="118" width="275" height="92" class="imgph"/>
    <text x="1177.5" y="162" text-anchor="middle" class="small">Replace myosin structure image</text>
  </g>

  <path d="M 605 260 C 700 255, 715 285, 760 330" class="arrow"/>
  <path d="M 1010 242 C 955 270, 900 302, 825 330" class="arrow"/>

  <text x="813" y="350" text-anchor="middle" class="section-header">Molecular Docking Simulation</text>

  <g id="midbar_complex">
    <rect x="690" y="372" rx="10" ry="10" width="685" height="38" class="headerbar"/>
    <text x="1032.5" y="398" text-anchor="middle" class="section-header">Highest Affinity Complex: Myosin-Chavicine</text>
  </g>

  <g id="panel_complex_left">
    <rect x="605" y="410" width="485" height="170" class="imgph"/>
    <text x="847.5" y="495" text-anchor="middle" class="small">Replace myosin–chavicine complex image</text>
  </g>

  <g id="panel_complex_zoom">
    <rect x="1090" y="410" width="285" height="170" class="imgph"/>
    <text x="1232.5" y="495" text-anchor="middle" class="small">Replace binding-site zoom image</text>
  </g>

  <line x1="1090" y1="410" x2="1090" y2="580" class="divider"/>
  <path d="M 1045 455 L 1105 435" class="thin-arrow"/>
  <path d="M 1045 515 L 1105 555" class="thin-arrow"/>

  <g id="panel_md">
    <rect x="18" y="408" rx="12" ry="12" width="625" height="290" class="panel"/>
    <rect x="18" y="408" rx="12" ry="12" width="625" height="44" class="headerbar"/>
    <text x="330.5" y="437" text-anchor="middle" class="section-header">Molecular Dynamics (100 ns) &amp; MM-PBSA</text>

    <g id="plotA">
      <text x="28" y="490" class="label">A</text>
      <rect x="45" y="466" width="175" height="82" class="imgph2"/>
      <text x="132.5" y="510" text-anchor="middle" class="small">Replace plot</text>
      <text x="132.5" y="565" text-anchor="middle" class="small">Complex &amp; Apo RMSD</text>
    </g>
    <g id="plotB">
      <text x="232" y="490" class="label">B</text>
      <rect x="248" y="466" width="175" height="82" class="imgph2"/>
      <text x="335.5" y="510" text-anchor="middle" class="small">Replace plot</text>
      <text x="335.5" y="565" text-anchor="middle" class="small">Per-residue RMSF</text>
    </g>
    <g id="plotC">
      <text x="436" y="490" class="label">C</text>
      <rect x="452" y="466" width="175" height="82" class="imgph2"/>
      <text x="539.5" y="510" text-anchor="middle" class="small">Replace plot</text>
      <text x="539.5" y="565" text-anchor="middle" class="small">Rg Stability</text>
    </g>
    <g id="plotD">
      <text x="28" y="610" class="label">D</text>
      <rect x="45" y="586" width="175" height="82" class="imgph2"/>
      <text x="132.5" y="630" text-anchor="middle" class="small">Replace plot</text>
      <text x="132.5" y="685" text-anchor="middle" class="small">Intermolecular Hydrogen Bonds</text>
    </g>
    <g id="plotE">
      <text x="232" y="610" class="label">E</text>
      <rect x="248" y="586" width="175" height="82" class="imgph2"/>
      <text x="335.5" y="630" text-anchor="middle" class="small">Replace plot</text>
      <text x="335.5" y="685" text-anchor="middle" class="small">Solvent Accessible Surface Area</text>
    </g>
    <g id="plotF">
      <text x="436" y="610" class="label">F</text>
      <rect x="452" y="586" width="175" height="82" class="imgph2"/>
      <text x="539.5" y="630" text-anchor="middle" class="small">Replace plot</text>
      <text x="539.5" y="685" text-anchor="middle" class="small">Per-residue Free Energy Decomposition</text>
    </g>
  </g>

  <g id="panel_findings">
    <rect x="1038" y="595" rx="12" ry="12" width="337" height="104" class="panel"/>
    <rect x="1038" y="595" rx="12" ry="12" width="337" height="40" class="headerbar"/>
    <text x="1206.5" y="622" text-anchor="middle" class="section-header">Selected Key Findings</text>
    <text x="1052" y="650" class="tiny">MD (100 ns) shows lower RMSD fluctuations and stabilization</text>
    <text x="1052" y="667" class="tiny">of the complex. MM-PBSA reveals a ΔGbind of -38.7 kcal/mol,</text>
    <text x="1052" y="684" class="tiny">driven mainly by van der Waals and electrostatic contributions.</text>
    <text x="1052" y="701" class="tiny">Top energy decomposition contributions from ILE481 and VAL652.</text>
  </g>

  <g id="keywords">
    <text x="62" y="744" class="section-header" style="font-size:18px;">Keywords:</text>
    <text x="180" y="744" class="keyword">Black Pepper, Myofibrillar Protein, Myosin, Alkaloid, Molecular Docking, Molecular Dynamics, MM-PBSA</text>
  </g>
</svg>
